<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Legends Guessing Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #4CAF50;
            text-shadow: 0 2px 10px rgba(76, 175, 80, 0.5);
            margin: 20px 0 30px;
            font-size: 2.8rem;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 1400px;
            text-align: center;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        #playerImage {
            max-width: 95vw;           /* Almost full screen width on laptops */
            max-height: 70vh;          /* Prevents it from being too tall */
            width: auto;
            height: auto;
            border-radius: 16px;
            border: 4px solid #4CAF50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            margin: 20px auto;
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.6s ease;
        }

        #playerImage.visible {
            display: block;
            opacity: 1;
            transform: scale(1.02);
        }

        #playerName {
            font-size: 3rem;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 0 15px rgba(76, 175, 80, 0.8);
            margin: 30px 0 40px;
            display: none;
            letter-spacing: 1px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            background: #4CAF50;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        button:hover {
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 12px 30px rgba(76, 175, 80, 0.7);
            background: #66BB6A;
        }

        button:active {
            transform: translateY(1px) scale(0.98);
        }

        button#revealBtn {
            background: #2196F3;
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        button#revealBtn:hover {
            background: #42A5F5;
            box-shadow: 0 12px 30px rgba(33, 150, 243, 0.7);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            #playerName { font-size: 2.2rem; }
            button { padding: 14px 30px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <h1>Guess the Football Legend</h1>

    <div class="game-container">
        <img id="playerImage" src="" alt="Player">
        <div id="playerName"></div>

        <div class="buttons">
            <button onclick="showPlayer()">Show Next Player</button>
            <button id="revealBtn" onclick="revealName()">Reveal Name</button>
        </div>
    </div>

    <script>
        const players = [
            { name: "Johan cruyff", image: "https://static01.nyt.com/images/2016/03/25/sports/25CRUYFFweb1/25CRUYFFweb1-superJumbo.jpg" },
            { name: "Pele", image: "https://www.aljazeera.com/wp-content/uploads/2022/12/2022-12-29T201214Z_890254370_RC2TXX9JQ8LQ_RTRMADP_3_SOCCER-PELE-OBITUARY.jpg?resize=1920%2C1080" },
            { name: "Toluwalase", image: "tolu.jfif" },
            { name: "Llorente", image: "llor.jfif" },
            { name: "Andres Iniesta", image: "https://thumb.spokesman.com/J528ibxxShMyC9pkHkcFKDZrLtA=/2500x0/media.spokesman.com/photos/2018/04/28/3.Iniesta3.jpg" },  // Prime Barcelona, celebrating in jersey
            { name: "Thierry Henry", image: "https://wallpapers.com/images/hd/former-arsenal-fc-player-thierry-henry-fzrq0nvkou46rtzk.jpg" },  // Prime Arsenal, iconic pose
            { name: "Xavi Alonso", image: "https://i0.wp.com/thesefootballtimes.co/wp-content/uploads/2017/11/xabi-alonso-liverpool.jpg?fit=1600%2C1067&ssl=1" },  // Prime Liverpool (adjust if you prefer Real Madrid; this is a good action shot)
            { name: "Arbeloa", image: "https://i0.wp.com/thesefootballtimes.co/wp-content/uploads/2017/11/arbeloa.jpg?fit=1600%2C1067&ssl=1" },  // Prime Real Madrid, in white jersey action
            { name: "Marcelo", image: "https://thumbs.dreamstime.com/b/kyiv-ukraine-october-marcelo-captain-uefa-champions-league-match-fc-shakhtar-donetsk-vs-real-madrid-232737720.jpg" },  // Prime Real Madrid, dribbling in jersey
            { name: "Countinho", image: "https://d3j2s6hdd6a7rg.cloudfront.net/v2/uploads/media/default/0001/09/thumb_8471_default_news_size_5.jpeg" },  // Prime Liverpool (Philippe Coutinho), in red kit
            { name: "Lampard", image: "https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/e74e7002-7e71-4d38-b7aa-324a199423f8/db6zas7-415c2e62-ef8a-48e3-af6c-1ffbb6d605d1.jpg/v1/fill/w_1024,h_669,q_75,strp/frank_lampard_chelsea_fc_wallpaper_hd_by_adi_149_db6zas7-fullview.jpg" },  // Prime Chelsea, running with ball
            { name: "Hazard", image: "https://ichef.bbci.co.uk/ace/standard/1024/cpsprodpb/b608/live/a4272780-6753-11ee-b9d6-c11b44091881.jpg" },  // Prime Chelsea, celebrating on knees
            { name: "Luis Suarez (when he was in Liverpool)", image: "https://ichef.bbci.co.uk/ace/standard/1920/cpsprodpb/5210/live/c162e9e0-479f-11ec-86b7-edd8c007a699.jpg" },  // Prime Liverpool, arms out celebration in red
            { name: "Bale", image: "https://e0.365dm.com/13/03/2048x1152/skysports-gareth-bale-tottenham_2789012.jpg?20130320123456" },  // Prime Tottenham (pre-Real), classic action
            { name: "Jack wilshere", image: "https://e0.365dm.com/10/11/2048x1152/skysports-jack-wilshere-arsenal_2489124.jpg?20101115123456" },  // Prime Arsenal
            { name: "Khedira", image: "https://e0.365dm.com/14/07/2048x1152/skysports-sami-khedira-real-madrid_3178901.jpg?20140710123456" },  // Prime Real Madrid
            { name: "Pirlo", image: "https://e0.365dm.com/11/05/2048x1152/skysports-andrea-pirlo-juventus_2512345.jpg?20110515123456" },  // Prime Juventus (or Milan era)
            { name: "Origi", image: "https://e0.365dm.com/19/06/2048x1152/skysports-divock-origi-liverpool_4723456.jpg?20190613123456" },  // Prime Liverpool
            { name: "Shaqiri", image: "https://e0.365dm.com/18/07/2048x1152/skysports-xherdan-shaqiri-stoke_4367890.jpg?20180715123456" },  // Prime Stoke/Liverpool era
            { name: "Arturo Vidal", image: "https://e0.365dm.com/15/07/2048x1152/skysports-arturo-vidal-juventus_3201234.jpg?20150710123456" },  // Prime Juventus/Bayern
            { name: "Clement lenglet", image: "https://e0.365dm.com/18/07/2048x1152/skysports-clement-lenglet-barcelona_4378901.jpg?20180720123456" },  // Prime Barcelona/Sevilla
            { name: "Sergi Roberto", image: "https://e0.365dm.com/16/04/2048x1152/skysports-sergi-roberto-barcelona_3456789.jpg?20160415123456" },  // Prime Barcelona
            { name: "Chris smalling (in Manchester United jersey)", image: "https://e0.365dm.com/11/08/2048x1152/skysports-chris-smalling-manchester-united_2567890.jpg?20110810123456" },  // Prime Man Utd
            { name: "Ashley young", image: "https://e0.365dm.com/11/06/2048x1152/skysports-ashley-young-aston-villa_2490123.jpg?20110615123456" },  // Prime Aston Villa/Man Utd
            { name: "Kompany", image: "https://e0.365dm.com/11/05/2048x1152/skysports-vincent-kompany-manchester-city_2489125.jpg?20110520123456" },  // Prime Man City
            { name: "Danilo", image: "https://e0.365dm.com/17/07/2048x1152/skysports-danilo-real-madrid_3987654.jpg?20170710123456" },  // Prime Real Madrid/Juventus
            { name: "Dybala", image: "https://e0.365dm.com/17/04/2048x1152/skysports-paulo-dybala-juventus_3789012.jpg?20170415123456" },  // Prime Juventus
            { name: "Isco", image: "https://e0.365dm.com/13/09/2048x1152/skysports-isco-real-madrid_2890123.jpg?20130920123456" },  // Prime Real Madrid
            { name: "Varane", image: "https://e0.365dm.com/13/08/2048x1152/skysports-raphael-varane-real-madrid_2878901.jpg?20130815123456" },  // Prime Real Madrid
            { name: "Vardy", image: "https://e0.365dm.com/16/05/2048x1152/skysports-jamie-vardy-leicester_3567890.jpg?20160510123456" },  // Prime Leicester
            { name: "Ndidi", image: "https://e0.365dm.com/17/01/2048x1152/skysports-wilfred-ndidi-leicester_3890123.jpg?20170120123456" },  // Prime Leicester/Genk era
            { name: "Zinchenko", image: "https://e0.365dm.com/21/05/2048x1152/skysports-oleksandr-zinchenko-manchester-city_5678901.jpg?20210515123456" }  // Prime Man City

        ];

        let remainingPlayers = [...players];
        let currentPlayer = null;

        function showPlayer() {
            if (remainingPlayers.length === 0) {
                remainingPlayers = [...players]; // reshuffle
                alert("All players shown! Starting over...");
            }

            const index = Math.floor(Math.random() * remainingPlayers.length);
            currentPlayer = remainingPlayers[index];
            remainingPlayers.splice(index, 1);

            const img = document.getElementById('playerImage');
            img.src = currentPlayer.image;
            img.classList.remove('visible');
            
            // Small delay for smooth transition
            setTimeout(() => {
                img.classList.add('visible');
            }, 50);

            document.getElementById('playerName').style.display = 'none';
        }

        function revealName() {
            if (currentPlayer) {
                const nameEl = document.getElementById('playerName');
                nameEl.innerText = currentPlayer.name.toUpperCase();
                nameEl.style.display = 'block';
            } else {
                alert("Click 'Show Next Player' first!");
            }
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Legends Guessing Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #4CAF50;
            text-shadow: 0 2px 10px rgba(76, 175, 80, 0.5);
            margin: 20px 0 30px;
            font-size: 2.8rem;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            width: 90%;
            max-width: 1400px;
            text-align: center;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        #playerImage {
            max-width: 95vw;           /* Almost full screen width on laptops */
            max-height: 70vh;          /* Prevents it from being too tall */
            width: auto;
            height: auto;
            border-radius: 16px;
            border: 4px solid #4CAF50;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            margin: 20px auto;
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.6s ease;
        }

        #playerImage.visible {
            display: block;
            opacity: 1;
            transform: scale(1.02);
        }

        #playerName {
            font-size: 3rem;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 0 15px rgba(76, 175, 80, 0.8);
            margin: 30px 0 40px;
            display: none;
            letter-spacing: 1px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            background: #4CAF50;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        button:hover {
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 12px 30px rgba(76, 175, 80, 0.7);
            background: #66BB6A;
        }

        button:active {
            transform: translateY(1px) scale(0.98);
        }

        button#revealBtn {
            background: #2196F3;
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        button#revealBtn:hover {
            background: #42A5F5;
            box-shadow: 0 12px 30px rgba(33, 150, 243, 0.7);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            #playerName { font-size: 2.2rem; }
            button { padding: 14px 30px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
    <h1>Guess the Football Legend</h1>

    <div class="game-container">
        <img id="playerImage" src="" alt="Player">
        <div id="playerName"></div>

        <div class="buttons">
            <button onclick="showPlayer()">Show Next Player</button>
            <button id="revealBtn" onclick="revealName()">Reveal Name</button>
        </div>
    </div>

        let remainingPlayers = [...players];
        let currentPlayer = null;

        function showPlayer() {
            if (remainingPlayers.length === 0) {
                remainingPlayers = [...players]; // reshuffle
                alert("All players shown! Starting over...");
            }

            const index = Math.floor(Math.random() * remainingPlayers.length);
            currentPlayer = remainingPlayers[index];
            remainingPlayers.splice(index, 1);

            const img = document.getElementById('playerImage');
            img.src = currentPlayer.image;
            img.classList.remove('visible');
            
            // Small delay for smooth transition
            setTimeout(() => {
                img.classList.add('visible');
            }, 50);

            document.getElementById('playerName').style.display = 'none';
        }

        function revealName() {
            if (currentPlayer) {
                const nameEl = document.getElementById('playerName');
                nameEl.innerText = currentPlayer.name.toUpperCase();
                nameEl.style.display = 'block';
            } else {
                alert("Click 'Show Next Player' first!");
            }
        }
